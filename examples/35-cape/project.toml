# The cape example's project file: it loads a model, and a model is found
# under `content/`, which a project.toml is what makes of a folder.

[project]
name = "Ludwerk Cape"
id = "dev.ludwerk.cape"
version = "1.0.0"
engine = "0.1"
# The figures, their capes and the wind are a scene on disk, so the example
# opens in the editor with them; the script only moves one of them.
scene = "scenes/cape.scene.json"

[window]
title = "Ludwerk — Cape"
size = [1600, 900]
