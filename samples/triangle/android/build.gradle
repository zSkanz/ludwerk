// Root build file. Version pins and the out-of-tree rule live here.
//
// The Android Gradle Plugin is pinned to 8.9.3: API 36, which the Play store
// requires of new apps and updates since 2026-08-31, needs 8.9.1 or later, and
// 8.9.3 is that line's last fix. SDL3 vendors 8.7.3 in
// `third_party/sdl3/android-project/build.gradle`, and its Java glue builds
// under both. Gradle is the version the wrapper names (8.12, see
// gradle/wrapper/gradle-wrapper.properties), above 8.9's floor of 8.11.1, on
// JDK 17. R5 forbids the "latest" that would otherwise make the choice
// implicitly.

plugins {
    id 'com.android.application' version '8.9.3' apply false
}

// R14, applied to Gradle. Left alone, AGP writes `app/build/` straight into the
// source tree -- and `.gitignore`'s build patterns are root-anchored on purpose
// (an unanchored `build-*/` once swallowed a vendored upstream directory), so
// nothing there would catch it. Redirecting the build directory is the fix that
// matches the rule rather than the fix that hides the symptom.
//
// The project cache (`.gradle/`) cannot be moved from here -- Gradle only takes
// `--project-cache-dir` on the command line -- so the CI job passes it and a
// local run should too.
def buildRoot = project.findProperty('engine.buildRoot') ?: System.getenv('ENG_BUILD_ROOT')
if (buildRoot == null) {
    throw new GradleException(
        'ENG_BUILD_ROOT is not set. Builds in this repository are always out-of-tree (R14);\n' +
        'scripts/bootstrap.ps1 and scripts/bootstrap.sh set it, or pass -Pengine.buildRoot=<dir>.')
}

allprojects {
    layout.buildDirectory = file("${buildRoot}/android-triangle-gradle/${project.name}")
}
