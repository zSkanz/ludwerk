// The Android package of a Ludwerk game: the player host (`libmain.so`), the
// engine's content and one project, extracted to the app's storage on first
// launch (engine/platform/src/platform.cpp, `extractAndroidPayload`).
//
// A separate Gradle build, like the triangle sample's, so no Gradle tooling
// reaches the repository root. scripts/android-player.ps1 drives it; the owner
// asked for a game on a phone on 2026-09-26, which is the first step of the
// mobile phase (R15) and is recorded in PROGRESS.md.

pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'engine-player'
include ':app'

// **A bundle carries the game in a pack of its own** (ADR 0104, amended): an
// install-time asset pack, which a store delivers with the app and which the
// app reads as its own assets. `ludwerk build` stages the pack's module --
// its two-line build file and the game under `src/main/assets/` -- and names
// the folder here; an APK has none, and the game is in the app itself.
def packDir = startParameter.projectProperties.get('engine.packDir')
if (packDir != null) {
    include ':game'
    project(':game').projectDir = new File(packDir)
}
